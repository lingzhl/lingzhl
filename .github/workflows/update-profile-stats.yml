name: Update Profile Stats

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-profile-stats.yml"
      - "scripts/update_profile_stats.py"
      - "assets/profile-details.svg"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile
        uses: actions/checkout@v4

      - name: Update combined stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: lingzhl
          CONTRIBUTED_REPOS: limouren2000/YYAbroad
        run: python scripts/update_profile_stats.py

      - name: Commit updated stats
        run: |
          if git diff --quiet -- assets/profile-details.svg; then
            echo "Stars have not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-details.svg
          git commit -m "Update profile star count"
          git push
